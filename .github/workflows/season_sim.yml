name: Season Sim Projection

on:
  schedule:
    # Runs once daily. The script itself checks the date and exits with no
    # changes outside the July 1 -> season-start window, so it's safe to
    # leave this cron running year-round.
    - cron: '0 9 * * *'   # 9am UTC daily — GitHub may delay this on free tier
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  run-season-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies (needed to build httr/curl/openssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","httr","jsonlite"), repos="https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Run season sim projection
        run: Rscript season_sim.R

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season_sim/*.json
          git diff --cached --quiet || git commit -m "Update season sim projection [skip ci]"
          git push
