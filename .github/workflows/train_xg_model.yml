name: Train xG Model

# Manual trigger ONLY — deliberately not on a schedule. Unlike season_sim.R
# (which needs fresh numbers daily), the shot-to-goal relationship doesn't
# meaningfully drift day to day, so there's no reason to retrain constantly.
# Re-run manually whenever more seasons get backfilled or the feature
# engineering changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","remotes"), repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_version("xgboost", version = "1.7.8.1", repos = "https://cloud.r-project.org")'

      - name: Train xG model
        run: Rscript train_xg_model.R

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/xg_model/
          git diff --cached --quiet || git commit -m "Retrain xG model"
          git push
