name: Scrape NHL Edge Stats

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NHL_PAT }}

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e "install.packages(c('httr','jsonlite','dplyr','readr','base64enc'))"

      - name: Run Edge scraper for current season
        env:
          GITHUB_PAT: ${{ secrets.NHL_PAT }}
        run: Rscript -e "source('nhl_edge_scraper.R'); run_edge_scraper(seasons_override=c(2026))"
