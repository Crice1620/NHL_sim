name: On-Ice Stats (Daily)

permissions:
  contents: write   # required so the default GITHUB_TOKEN can push commits

on:
  schedule:
    # Runs once daily. Only checks the last 4 days for newly-completed games
    # (see find_recent_games in onice_stats.R). Use the separate
    # "On-Ice Stats (Backfill)" workflow for filling in history.
    - cron: '0 10 * * *'   # 10am UTC daily
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  run-onice-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify xG model file exists
        run: |
          if [ ! -f data/xg_model/xg_model.rds ]; then
            echo "::error::data/xg_model/xg_model.rds not found"
            ls -la data/xg_model || true
            exit 1
          fi
          echo "Found data/xg_model/xg_model.rds"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies (needed to build httr/curl/openssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","httr","jsonlite","xgboost"), repos="https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Show installed xgboost version
        run: Rscript -e 'cat("xgboost", as.character(packageVersion("xgboost")), "\n")'

      - name: Run daily on-ice stats update
        run: Rscript onice_stats.R --mode=daily

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if compgen -G "data/onice/*/skater_onice.csv" > /dev/null; then
            git add data/onice/
            if git diff --cached --quiet; then
              echo "Nothing changed since last run — nothing to commit."
            else
              git commit -m "Daily on-ice stats update [skip ci]"
              # Pull-first retry: this workflow shares main with season_sim.yml
              # and rapm_weekly.yml, so a plain push can race with them.
              pushed=false
              for i in 1 2 3; do
                if git pull --rebase origin main && git push; then
                  pushed=true
                  break
                fi
                echo "Push attempt $i failed, retrying..."
                sleep 5
              done
              if [ "$pushed" != "true" ]; then
                echo "::error::All push attempts failed."
                exit 1
              fi
            fi
          else
            echo "No on-ice output found yet — nothing to commit."
          fi
